name: Build ERIX APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify container toolchain
        shell: bash
        run: |
          echo "=== Python ==="
          python3 --version
          echo "=== Cython ==="
          python3 -c "import Cython; print('Cython:', Cython.__version__)" 2>/dev/null || echo "n/a"
          echo "=== Buildozer ==="
          buildozer --version 2>&1 | head -1
          echo "=== Java ==="
          java -version 2>&1 | head -1
          echo "=== HOME ==="
          echo "HOME=$HOME"
          echo "PWD=$PWD"
          echo "=== libtoolize ==="
          which libtoolize && libtoolize --version | head -1
          echo "=== autoconf ==="
          which autoconf && autoconf --version | head -1
          echo "=== Disk ==="
          df -h / | tail -1

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: /root/.buildozer
          key: docker-bz-global-10-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Cache buildozer project
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: docker-bz-proj-10-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Debug — find APK anywhere
        if: always()
        shell: bash
        run: |
          echo "=== PWD ==="
          pwd
          echo ""
          echo "=== HOME ==="
          echo "$HOME"
          echo ""
          echo "=== ls bin/ ==="
          ls -la bin/ 2>/dev/null || echo "NO bin/ dir"
          echo ""
          echo "=== find / -name '*.apk' (excluding proc/sys) ==="
          find / -name "*.apk" -type f 2>/dev/null | grep -v "/proc/" | grep -v "/sys/" | head -20 || echo "NO APK FOUND"
          echo ""
          echo "=== find /home /root /github /workspace -name '*.apk' ==="
          find /home /root /github /workspace -name "*.apk" -type f 2>/dev/null | head -20 || echo "none"
          echo ""
          echo "=== find . -name '*.apk' ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "none in workspace"
          echo ""
          echo "=== build.log tail ==="
          tail -20 build.log 2>/dev/null || echo "no build.log"
          echo ""
          echo "=== build result markers ==="
          grep -E "Android packaging done|Command failed|BUILD SUCCESSFUL|BUILD FAILED" build.log 2>/dev/null | tail -5 || echo "no markers"

      - name: Verify build succeeded
        shell: bash
        run: |
          set -e
          echo "=== Verify build.log ==="
          if ! grep -q "Android packaging done" build.log 2>/dev/null; then
            echo "❌ ERROR: 'Android packaging done' NOT found in build.log"
            echo "=== Last 50 lines of build.log ==="
            tail -50 build.log 2>/dev/null || true
            exit 1
          fi
          echo "✓ 'Android packaging done' found"
          echo ""
          echo "=== Verify APK exists ==="
          APK_COUNT=$(find / -name "*.apk" -type f 2>/dev/null | grep -v "/proc/" | grep -v "/sys/" | wc -l)
          echo "APK files found: $APK_COUNT"
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No APK found anywhere"
            exit 1
          fi
          echo "✓ APK found"
          find / -name "*.apk" -type f 2>/dev/null | grep -v "/proc/" | grep -v "/sys/" | head -5

      - name: Collect APK to bin/
        shell: bash
        run: |
          mkdir -p bin/
          echo "=== Copying APK from all known locations ==="
          for src in \
            /home/kivy/android/platform/build/dists/*/bin/*.apk \
            /home/user/.buildozer/android/platform/build-*/dists/*/bin/*.apk \
            /root/.buildozer/android/platform/build-*/dists/*/bin/*.apk \
            .buildozer/android/platform/build-*/dists/*/bin/*.apk; do
            if [ -f "$src" ]; then
              echo "  Copying: $src"
              cp "$src" bin/
            fi
          done
          echo ""
          echo "=== bin/ after copy ==="
          ls -la bin/ 2>/dev/null || echo "still empty"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: erix-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload log on fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
