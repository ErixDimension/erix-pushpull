name: Build ERIX Java APK
on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Android SDK Manual
        run: |
          # 1. Download command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          
          # 2. Ekstrak ke direktori SDK
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          # 3. Set environment variable untuk step selanjutnya
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          
          # 4. Install platform dan build-tools yang dibutuhkan
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compile APK using BuildAPKs script
        run: |
          export PATH=$PATH:$ANDROID_HOME/build-tools/34.0.0
          
          mkdir -p app/build
          mkdir -p app/src/main/res/values
          
          # 1. Kompilasi resource (Manifest)
          aapt package -f -m -J app/build -M app/src/main/AndroidManifest.xml -S app/src/main/res -I $ANDROID_HOME/platforms/android-34/android.jar
          
          # 2. Kompilasi Java ke .class
          javac -d app/build -classpath $ANDROID_HOME/platforms/android-34/android.jar app/src/main/java/com/erix/app/*.java app/build/com/erix/app/R.java
          
          # 3. Ubah .class ke .dex
          d8 --lib $ANDROID_HOME/platforms/android-34/android.jar --output app/build app/build/com/erix/app/*.class
          
          # 4. Bungkus jadi APK
          aapt package -f -M app/src/main/AndroidManifest.xml -S app/src/main/res -I $ANDROID_HOME/platforms/android-34/android.jar -F app/build/unsigned.apk
          cd app/build && aapt add unsigned.apk classes.dex && cd ../..
          
          # 5. Tanda tangan (debug)
          keytool -genkey -v -keystore app/build/debug.keystore -storepass android -alias androiddebugkey -keypass android -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks app/build/debug.keystore --ks-pass pass:android --key-pass pass:android --out app/build/ErixApp.apk app/build/unsigned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: erix-java-apk
          path: app/build/ErixApp.apk
          if-no-files-found: error
